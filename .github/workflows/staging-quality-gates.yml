name: Staging quality gates
on:
  push:
    branches: [staging, 'ops/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: staging-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate video quality policy
        run: node scripts/operations/video-quality-gate.mjs
      - name: Run regression suite
        run: npm test
      - name: Build and check production boundary
        run: npm run build
