name: Release integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  integrity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify article image geometry before release
        run: |
          npm run start -- -p 3000 > /tmp/brief-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/articles/maude-nfc-east-declines-winner > /dev/null; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true
          QA_BASE_URL=http://127.0.0.1:3000 npx playwright test qa/tests/article-image-framing.spec.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-integrity-image-report
          path: |
            qa/reports/browser-html
            qa/reports/browser-results.json
            qa/test-results
