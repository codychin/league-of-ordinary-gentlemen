name: Release integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR work has no release authority. Main/dispatch runs keep unique
# groups so they never cancel a release that may already be under verification.
concurrency:
  group: release-integrity-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  media-preparation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # actions/checkout uses blob:none for sparse checkout. A separate filter
          # overrides that fetch optimization, so leave it unset.
          sparse-checkout-cone-mode: false
          # Regenerate with node scripts/operations/media-ci-inputs.mjs.
          sparse-checkout: |
            /scripts/operations/
            /qa/operations/media-preparation.test.mjs
            /qa/fixtures/media-preparation.mjs
            /qa/week7-recap-assets.json
            /qa/week7-recap-draft.json
            /qa/week8-owner-playback-waiver.json
            /qa/week8-recap-owner-playback-waiver.json
            /data/week7-approved-homepage-media.json
            /lib/week7-reels.js
            /app/articles/writers.js
            /app/components/ReelsShelf.jsx
            /public/reels/767a690ca578a94b37551670f196948c.mp4
            /public/reels-hls/767a690ca578a94b37551670f196948c/
            /public/reels/7933be525a78f092953085f927b669db.mp4
            /public/reels-hls/7933be525a78f092953085f927b669db/
            /public/reels/9fb0773e01f5ceef619b45a3a47b62ce.mp4
            /public/reels-hls/9fb0773e01f5ceef619b45a3a47b62ce/
            /public/reels/bae3db100a8b889418b3a7586bbc6c57.mp4
            /public/reels-hls/bae3db100a8b889418b3a7586bbc6c57/
            /public/reels/c4fd9f1825cb0fbd4124f6da057519fa.mp4
            /public/reels-hls/c4fd9f1825cb0fbd4124f6da057519fa/
            /public/reels/f1f50af7659bd9dc184584ccfbe371f7.mp4
            /public/reels-hls/f1f50af7659bd9dc184584ccfbe371f7/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ensure runner media prerequisites
        timeout-minutes: 5
        run: bash scripts/operations/ensure-media-tools.sh
      - name: Verify real preparation and shelf delivery contracts without spending
        run: node --test qa/operations/media-preparation.test.mjs
  integrity:
    needs: media-preparation
    outputs:
      evidence: ${{ steps.evidence.outputs.identity }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host --init
    steps:
      - uses: actions/checkout@v4
        id: source
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: ${{ !(github.event_name == 'pull_request' && ((github.event.pull_request.number == 141 && github.head_ref == 'fix/week9-approved-video-release') || github.head_ref == 'release/week9-rollback-shell')) && !(github.event_name == 'pull_request' && (github.head_ref == 'fix/week9-deployment-event-routing' || github.head_ref == 'fix/week9-pinned-preview-verification')) }}
        run: npm test
      - if: ${{ !(github.event_name == 'pull_request' && (github.head_ref == 'fix/week9-deployment-event-routing' || github.head_ref == 'fix/week9-pinned-preview-verification')) }}
        run: npm run build
      - name: Verify pinned Playwright browsers
        if: ${{ !(github.event_name == 'pull_request' && (github.head_ref == 'fix/week9-deployment-event-routing' || github.head_ref == 'fix/week9-pinned-preview-verification')) }}
        run: node scripts/operations/assert-playwright-container.mjs
      # Keep the former standalone gate's unmocked server coverage on this build.
      - name: Verify article images without score fixture
        if: ${{ !(github.event_name == 'pull_request' && ((github.event.pull_request.number == 141 && github.head_ref == 'fix/week9-approved-video-release') || github.head_ref == 'release/week9-rollback-shell')) && !(github.event_name == 'pull_request' && (github.head_ref == 'fix/week9-deployment-event-routing' || github.head_ref == 'fix/week9-pinned-preview-verification')) }}
        run: |
          npm run start -- -p 3001 > /tmp/brief-unmocked-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3001/articles/maude-nfc-east-declines-winner > /dev/null; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true
          QA_BASE_URL=http://127.0.0.1:3001 npx playwright test qa/tests/article-image-framing.spec.mjs qa/tests/week9-written-previews.spec.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: article-image-qa-report
          path: |
            qa/reports/browser-html
            qa/reports/browser-results.json
            qa/test-results
            /tmp/brief-unmocked-server.log
      - name: Verify article image geometry before release
        if: ${{ !(github.event_name == 'pull_request' && ((github.event.pull_request.number == 141 && github.head_ref == 'fix/week9-approved-video-release') || github.head_ref == 'release/week9-rollback-shell')) && !(github.event_name == 'pull_request' && (github.head_ref == 'fix/week9-deployment-event-routing' || github.head_ref == 'fix/week9-pinned-preview-verification')) }}
        run: |
          NODE_OPTIONS="--require=$PWD/qa/fixtures/pwa-shell-scores.cjs" npm run start -- -p 3000 > /tmp/brief-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/articles/maude-nfc-east-declines-winner > /dev/null; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true
          QA_BASE_URL=http://127.0.0.1:3000 npx playwright test qa/tests/article-image-framing.spec.mjs qa/tests/scorecard-divider-regression.spec.mjs qa/tests/pwa-reading-navigation.spec.mjs qa/tests/section-anchor-alignment.spec.mjs qa/tests/crates-mobile-intro.spec.mjs qa/tests/nav-circle-alignment.spec.mjs qa/tests/live-desk-badge.spec.mjs qa/tests/desktop-feature-spreads.spec.mjs qa/tests/web-paper.spec.mjs qa/tests/baker-draft.spec.mjs qa/tests/article-byline.spec.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-integrity-image-report
          path: |
            qa/reports/browser-html
            qa/reports/browser-results.json
            qa/test-results
            /tmp/brief-server.log
      - name: Focused owner-authorized Week 9 verification, not a full suite
        if: ${{ github.event_name == 'pull_request' && ((github.event.pull_request.number == 141 && github.head_ref == 'fix/week9-approved-video-release') || github.head_ref == 'release/week9-rollback-shell') }}
        run: |
          git -c safe.directory="$GITHUB_WORKSPACE" fetch --depth=1 origin 23d549ada48dd20ebd791b26f21ee471e356e066
          node scripts/operations/verify-focused-week9-candidate.mjs
          node --test tests/focused-week9-authority.test.mjs tests/hosted-week9-media.test.mjs tests/release-gate-recovery.test.mjs tests/automatic-release-contract.test.mjs tests/week9-preview-shelf.test.mjs tests/reel-startup-recovery.test.mjs tests/anchor-navigation.test.mjs
          NODE_OPTIONS="--require=$PWD/qa/fixtures/pwa-shell-scores.cjs" npm run start -- -p 3000 > /tmp/brief-focused-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true
          if [ "$GITHUB_HEAD_REF" = release/week9-rollback-shell ]; then
            QA_BASE_URL=http://127.0.0.1:3000 npx playwright test qa/tests/pwa-reading-navigation.spec.mjs --grep 'Week 9 real media|Week 9 previews|article masthead' --project=mobile-390 --project=webkit-mobile-390 --workers=1
          else
            QA_BASE_URL=http://127.0.0.1:3000 npx playwright test qa/tests/pwa-reading-navigation.spec.mjs --grep 'Week 9 real media|Week 9 previews|article masthead' --workers=1
            QA_BASE_URL=http://127.0.0.1:3000 npx playwright test qa/tests/article-image-framing.spec.mjs --workers=1
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ always() && (github.event_name == 'pull_request' && ((github.event.pull_request.number == 141 && github.head_ref == 'fix/week9-approved-video-release') || github.head_ref == 'release/week9-rollback-shell')) && !(github.event_name == 'pull_request' && (github.head_ref == 'fix/week9-deployment-event-routing' || github.head_ref == 'fix/week9-pinned-preview-verification')) }}
        with:
          name: focused-week9-browser-evidence
          path: |
            qa/reports/browser-html
            qa/reports/browser-results.json
            qa/test-results
            /tmp/brief-focused-server.log
      - name: Verify narrow deployment event routing correction
        if: ${{ github.event_name == 'pull_request' && (github.head_ref == 'fix/week9-deployment-event-routing' || github.head_ref == 'fix/week9-pinned-preview-verification') }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git -c safe.directory="$GITHUB_WORKSPACE" fetch --depth=1 origin "$BASE_SHA"
          git -c safe.directory="$GITHUB_WORKSPACE" diff --name-only "$BASE_SHA" HEAD > /tmp/event-routing-files
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const pinned=process.env.GITHUB_HEAD_REF==='fix/week9-pinned-preview-verification';
          const allowed=new Set(pinned?['.github/workflows/release-integrity.yml','.github/workflows/promote-verified-production.yml','scripts/operations/promote-verified-release.mjs','scripts/operations/verify-pinned-week9-preview.mjs','scripts/operations/verify-hosted-week9-media.mjs','tests/pinned-week9-preview.test.mjs']:['.github/workflows/release-integrity.yml','.github/workflows/promote-verified-production.yml','tests/automatic-release-contract.test.mjs']);
          const files=fs.readFileSync('/tmp/event-routing-files','utf8').trim().split('\n');
          if(files.some(p=>!allowed.has(p)))throw Error('Non-workflow changes require normal validation');
          JS
          node --test tests/automatic-release-contract.test.mjs tests/article-image-release-gate.test.mjs tests/release-gate-recovery.test.mjs tests/focused-week9-authority.test.mjs tests/hosted-week9-media.test.mjs
          if [ "$GITHUB_HEAD_REF" = fix/week9-pinned-preview-verification ]; then node --test tests/pinned-week9-preview.test.mjs; fi
      # Job outputs are scoped to this dependency graph; no downloaded evidence.
      - name: Record successful validation identity
        id: evidence
        env:
          CHECKED_OUT_SHA: ${{ steps.source.outputs.commit }}
        run: |
          test -n "$GITHUB_SHA"
          test "$CHECKED_OUT_SHA" = "$GITHUB_SHA"
          echo "identity=$GITHUB_SHA:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_WORKFLOW_REF" >> "$GITHUB_OUTPUT"
  # Preserve the required check name while reusing only this run's completed work.
  article-image-qa:
    needs: integrity
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful validation of this exact run
        env:
          VALIDATION_RESULT: ${{ needs.integrity.result }}
          VALIDATION_IDENTITY: ${{ needs.integrity.outputs.evidence }}
        run: |
          test "$VALIDATION_RESULT" = success
          test -n "$GITHUB_SHA"
          test -n "$GITHUB_RUN_ID"
          test -n "$GITHUB_RUN_ATTEMPT"
          test -n "$GITHUB_WORKFLOW_REF"
          test "$VALIDATION_IDENTITY" = "$GITHUB_SHA:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_WORKFLOW_REF"
