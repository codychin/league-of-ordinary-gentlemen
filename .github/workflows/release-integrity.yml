name: Release integrity
on:
  push:
    branches: [diagnostic/week9-video-startup]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  video-startup-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host --init
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Isolated real-media startup diagnosis, no publication or full suite
        run: |
          NODE_OPTIONS="--require=$PWD/qa/fixtures/pwa-shell-scores.cjs" npm run start -- -p 3000 > /tmp/video-startup-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true
          command -v pactl >/dev/null && pactl info > /tmp/audio-backend-info.txt 2>&1 || true
          DEBUG=pw:browser BASE_URL=http://127.0.0.1:3000 node scripts/operations/diagnose-video-startup.mjs > /tmp/video-startup-browser.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: week9-video-startup-diagnostic
          path: |
            qa/reports/video-startup-diagnostic.json
            /tmp/video-startup-browser.log
            /tmp/video-startup-server.log
            /tmp/audio-backend-info.txt
