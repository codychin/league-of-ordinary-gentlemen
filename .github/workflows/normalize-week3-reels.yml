name: Normalize Week 3 reels

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-week3-reels.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Download and normalize approved masters
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/reels /tmp/reels
          transcode () {
            id="$1"; url="$2"
            curl -L --fail --retry 3 "$url" -o "/tmp/reels/$id-source.mp4"
            ffmpeg -y -i "/tmp/reels/$id-source.mp4" \
              -c:v libx264 -profile:v high -level 4.0 -pix_fmt yuv420p -preset medium -crf 20 \
              -movflags +faststart -c:a aac -b:a 160k -ar 48000 \
              "public/reels/$id.mp4"
          }
