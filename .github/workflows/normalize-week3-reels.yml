name: Normalize current reels

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-week3-reels.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Download and normalize approved masters
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/reels /tmp/reels
          transcode () {
            id="$1"; url="$2"
            curl -L --fail --retry 3 "$url" -o "/tmp/reels/$id-source.mp4"
            ffmpeg -y -i "/tmp/reels/$id-source.mp4" \
              -c:v libx264 -profile:v high -level 4.0 -pix_fmt yuv420p -preset medium -crf 20 \
              -movflags +faststart -c:a aac -b:a 160k -ar 48000 \
              "public/reels/$id.mp4"
          }
          transcode "bbccb6476e9b99f1618faba7e61f27d1" "https://files2.heygen.ai/aws_pacific/avatar_tmp/88574ea85d0040b2a2836001c97400ea/bbccb6476e9b99f1618faba7e61f27d1.mp4?Expires=1791505261&Signature=Xfa0K5Ai2Im7k-1a-SlbjGD-xk9V0cow8W4RF1Oa8VAQOM7fjOJfvVrJAjYrbehBANcqS7iuuYArJR2AYu5hHKkUH-jTiRg5v9NQEAqaKfcQ5uHpu21uKVeGxJl9MPItgQ4dtsBfd2LZmrgVxrGELeomCuBr9iQbe-rjWH935LkW~z9l3BFdpFjd18ICFi0xTG82wnu7iUCFYFwIMKJRXse4Zs4M2rqOnVRXmLQhZ960JHYqYogIplxG4ygfLQqZoO6k-0cZPpHEH1czlyXtovaZu5Iph59zE2jDaP56A8rce-wbW0MyeAF1q7l5QgnqG8Nx0ItYpf2wIhiaCu1Ddg__&Key-Pair-Id=K38HBHX5LX3X2H"
