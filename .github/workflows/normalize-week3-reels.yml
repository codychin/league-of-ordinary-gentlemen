      - name: Verify codecs
        run: |
          for f in public/reels/*.mp4; do
            ffprobe -v error -show_entries stream=codec_name,pix_fmt -of compact "$f"
          done
      - name: Commit normalized reels
        run: |
          git config user.name "brief-reels-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/reels
          git commit -m "Host normalized Week 3 reel masters" || exit 0
          git push
