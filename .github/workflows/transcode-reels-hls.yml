name: Transcode reels to HLS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/transcode-reels-hls.yml'
      - 'scripts/operations/package-missing-hls.mjs'
      - 'scripts/operations/fetch-hls-before.sh'
      - 'public/reels/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-reels-main
  cancel-in-progress: false

jobs:
  transcode:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fetch only the triggering comparison commit
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: bash scripts/operations/fetch-hls-before.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Plan missing packages without modifying existing media
        id: plan
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          plan=$(node scripts/operations/package-missing-hls.mjs --plan)
          echo "packages=$plan" >> "$GITHUB_OUTPUT"
      - name: Install ffmpeg only when packaging is required
        timeout-minutes: 5
        if: steps.plan.outputs.packages != '[]'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Build only missing HLS renditions and posters
        if: steps.plan.outputs.packages != '[]'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/operations/package-missing-hls.mjs
      - name: Commit generated media only onto the unchanged release
        if: steps.plan.outputs.packages != '[]'
        shell: bash
        run: |
          set -euo pipefail
          expected=$(git rev-parse HEAD)
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$expected" || { echo 'Main advanced; refusing stale media commit'; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/reels-hls
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Generate missing HLS reel renditions"
          # No rebase: a concurrent main update rejects this ordinary fast-forward push.
          git push origin HEAD:main
