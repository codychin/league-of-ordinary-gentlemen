name: Publish approved Week 5 recaps
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-week5-recaps.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: week5-recap-publication
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python3 scripts/package-week5-recaps.py
      - run: node --test tests/release-integrity.test.mjs tests/production-release-rules.test.mjs tests/global-routing-completeness.test.mjs
      - name: Commit approved recaps and complete playback assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/reels public/reels-hls app/page.js lib/doge-reels.js lib/sunday-reels.js lib/edition-content.js tests/release-integrity.test.mjs
          git commit -m "Publish all 18 approved Week 5 recaps with corrected audio"
          git pull --rebase origin main
          git push origin HEAD:main
