name: Promote verified production release
on:
  workflow_dispatch:
  deployment_status:
  workflow_run:
    workflows: ["Release integrity", "Article image release gate"]
    types: [completed]
permissions:
  contents: read
  checks: read
  id-token: write
jobs:
  candidate:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      eligible: ${{ steps.queue.outputs.eligible }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.deployment.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/operations/release-candidate.mjs
      - name: Validate current main and both checks before acquiring the promotion lock
        id: queue
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.event.deployment.sha }}
        run: node scripts/operations/release-candidate.mjs
  focused_candidate:
    if: ${{ github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production – league-of-ordinary-gentlemen' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      eligible: ${{ steps.scope.outputs.eligible }}
    steps:
      - name: Recognize only the explicitly authorized Week 9 main commit
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.deployment.sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module - <<'JS'
          import {appendFileSync} from 'node:fs';
          const sha=process.env.RELEASE_SHA,repo=process.env.RELEASE_REPOSITORY;
          let eligible=false;
          if(repo==='codychin/league-of-ordinary-gentlemen'&&/^[a-f0-9]{40}$/.test(sha||'')){
            const get=async path=>{const r=await fetch('https://api.github.com/repos/'+repo+path,{redirect:'error',headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'}});if(!r.ok)throw Error('GitHub scope check failed');return r.json();};
            const main=await get('/branches/main');
            if(main.commit.sha===sha){const c=await get('/commits/'+sha);eligible=c.commit.message.includes('[focused-week9-release]');}
          }
          appendFileSync(process.env.GITHUB_OUTPUT,'eligible='+String(eligible)+'\n');
          JS
  promote:
    needs: [candidate, focused_candidate]
    if: ${{ !cancelled() && ((needs.candidate.result == 'success' && needs.candidate.outputs.eligible == 'true') || (needs.focused_candidate.result == 'success' && needs.focused_candidate.outputs.eligible == 'true')) }}
    concurrency:
      group: ordinarybrief-production-promotion
      cancel-in-progress: false
    environment: production
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host --init
    timeout-minutes: 30
    steps:
      - name: Require automatic promotion mode
        env:
          RELEASE_MODE: ${{ vars.BRIEF_RELEASE_MODE || 'verify-only' }}
        run: test "$RELEASE_MODE" = promote || { echo "Automatic promotion mode is not configured" >&2; exit 1; }
      - name: Require promotion credential before checkout
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN secret missing; release NOT promoted." >&2; exit 1; }
      - name: Check out exact validated commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.deployment.sha }}
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/operations/promote-verified-release.mjs
            /scripts/operations/promotion-state.mjs
            /scripts/operations/check-public-routes.mjs
            /scripts/operations/public-route-validation.mjs
            /scripts/operations/check-editorial-release.mjs
            /qa/release-expectations/
            /scripts/operations/verify-hosted-week9-media.mjs
            /scripts/operations/assert-playwright-container.mjs
            /scripts/operations/hosted-media-scope.mjs
            /scripts/operations/focused-week9-authority.mjs
            /qa/focused-week9-release.json
            /lib/week9-preview-cohort.mjs
            /qa/week9-owner-playback-waiver.json
            /data/week9-approved-homepage-media.json
            /qa/week9-packaged-media.json
            /package.json
            /package-lock.json
            /.github/workflows/release-integrity.yml
            /.github/workflows/promote-verified-production.yml
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install exact locked browser client without install scripts
        run: npm ci --ignore-scripts
      - name: Verify pinned trusted-runner browsers
        run: node scripts/operations/assert-playwright-container.mjs
      - name: Refuse to promote obsolete builds
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.event.deployment.sha }}
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          const r=await fetch('https://api.github.com/repos/codychin/league-of-ordinary-gentlemen/branches/main',{redirect:'error',headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'},signal:AbortSignal.timeout(20000)});
          assert.ok(r.ok,'Main identity lookup failed');
          assert.equal((await r.json()).commit.sha,process.env.RELEASE_SHA,'Superseded commit; refusing promotion');
          JS
      - name: Verify staged routes, promote exact successful build, and verify alias
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ vars.BRIEF_RELEASE_MODE || 'verify-only' }}
          FOCUSED_WEEK9_RELEASE: ${{ needs.focused_candidate.outputs.eligible == 'true' && '1' || '' }}
          RELEASE_CANARY_FAIL: ${{ vars.BRIEF_RELEASE_CANARY_FAIL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: prj_h89MCmxn3Mr3O0wRpnwstM917E0l
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.event.deployment.sha }}
        run: node scripts/operations/promote-verified-release.mjs
      - name: Verify live public routes after promotion
        env:
          BASE_URL: https://www.ordinarybrief.com
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node scripts/operations/check-public-routes.mjs; then exit 0; fi
            echo "Live route verification attempt $attempt failed"
            sleep 15
          done
          exit 1
      - name: Mark public verification in receipt
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          const receipt=JSON.parse(readFileSync('release-receipt.json','utf8'));
          assert.equal(receipt.state,'alias-verified');
          receipt.state='verified';
          receipt.publicRoutesVerifiedAt=new Date().toISOString();
          writeFileSync('release-receipt.json',JSON.stringify(receipt,null,2));
          JS
      - name: Preserve release receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-receipt.json
            hosted-media-receipt.json
          if-no-files-found: warn

  verify_pinned_week9_preview:
    # Disabled after run 42496531820 unexpectedly deployed the verifier source.
    if: ${{ false }}
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host --init
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/operations/
            /lib/week9-preview-cohort.mjs
            /data/week9-approved-homepage-media.json
            /qa/week9-owner-playback-waiver.json
            /qa/week9-packaged-media.json
            /package.json
            /package-lock.json
            /.github/workflows/release-integrity.yml
            /.github/workflows/promote-verified-production.yml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node scripts/operations/assert-playwright-container.mjs
      - name: Install fixed Vercel CLI without lifecycle scripts
        run: npm install --prefix /tmp/week9-vercel-cli --ignore-scripts --no-save vercel@65.12.1
      - name: Link local metadata to the pinned existing project
        run: |
          node --input-type=module -e "import fs from 'node:fs'; fs.mkdirSync('.vercel',{recursive:true}); fs.writeFileSync('.vercel/project.json',JSON.stringify({projectId:'prj_h89MCmxn3Mr3O0wRpnwstM917E0l',orgId:'team_hU7RX1oX9Ea0W2U9ieHwNxzL'}));"
      - name: Verify only pinned rollback preview; never promote
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: /tmp/week9-vercel-cli/node_modules/.bin/vercel env run -- node scripts/operations/verify-pinned-week9-preview.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-week9-preview-playback
          path: hosted-media-receipt.json
          if-no-files-found: error
