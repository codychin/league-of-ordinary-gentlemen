      - name: Validate all six before commit
        shell: bash
        run: |
          set -euo pipefail
          for id in 35be59702c0c7cca379ab5ca64c28788 8710323881d0b2cb1ec55d3cd8137629 4847ba749e3df2950b2c8c9d8a11308b 2aabd81db067067020c873233c783454 9250b953a32bbb06884b73f46ca43abe 934492ccc99c967bc89ba70313047cdd; do
            test -s "public/reels/$id.mp4"
            test -s "public/reels-hls/$id/index.m3u8"
            test -s "public/reels-hls/$id/poster.jpg"
            test -s "public/reels-hls/$id/seg_000.m4s"
          done
      - name: Commit complete candidate assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/reels public/reels-hls
          git commit -m "Package Sunday Crew Week 4 preview reels"
          git pull --rebase origin main
          git push origin HEAD:main
