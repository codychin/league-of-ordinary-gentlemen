name: Package Sunday Crew Week 4 reels
on:
  push:
    paths: ['.github/workflows/package-sunday-crew-week4.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Download, normalize, and package approved reels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/reels public/reels-hls
          transcode() {
            id="$1"; url="$2"; tmp="/tmp/$id.mp4"; out="public/reels-hls/$id"
            curl -fL --retry 3 --retry-delay 2 "$url" -o "$tmp"
            ffmpeg -y -i "$tmp" -map_metadata -1 -vf "scale='min(1080,iw)':-2:force_original_aspect_ratio=decrease" -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p -c:a aac -b:a 160k -ar 48000 -movflags +faststart "public/reels/$id.mp4"
            rm -rf "$out"; mkdir -p "$out"
            ffmpeg -y -ss 0.05 -i "public/reels/$id.mp4" -frames:v 1 -vf "scale='min(720,iw)':-2" -q:v 3 "$out/poster.jpg"
            ffmpeg -y -i "public/reels/$id.mp4" -vf "scale='min(720,iw)':-2:force_original_aspect_ratio=decrease" -c:v libx264 -preset medium -profile:v high -level 4.0 -b:v 2200k -maxrate 2600k -bufsize 4400k -g 60 -keyint_min 60 -sc_threshold 0 -c:a aac -b:a 128k -ar 48000 -hls_time 2 -hls_playlist_type vod -hls_segment_type fmp4 -hls_fmp4_init_filename init.mp4 -hls_segment_filename "$out/seg_%03d.m4s" "$out/index.m3u8"
          }
          transcode "35be59702c0c7cca379ab5ca64c28788" 'https://files2.heygen.ai/aws_pacific/avatar_tmp/88574ea85d0040b2a2836001c97400ea/35be59702c0c7cca379ab5ca64c28788.mp4?Expires=1791509310&Signature=Xr2z7YKreFASD4shS~JTvImF5iBqzY9Vu2PtcpiqHr4X78YozlDTgKE7cDeGm29Hj5CYMw1txAvAWwgfzqcRkCrMv0M-i9UKrLXBvkXs90V6kH~ixbK44k4M15R1aeTRIL-eYEvvJoTYDzaq3UlQGDZFILEeg6AfB43WXuOK3EXQlftZMoFSv9C4qj-vFRT1e-dvAgMWdcga16CItIzxYXU5bESPDvtH6aadmMmxgLm91sB~FwrV67nwIRQU8EotiHCxKv5iWg4wv0JsJ5Ea5DwM9tznyui0KWX8IwB224RCcMWhLZGPjebCGU1sVmzu5LdRJQO2zB3PuMOulId8aw__&Key-Pair-Id=K38HBHX5LX3X2H'
