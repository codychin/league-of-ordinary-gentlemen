name: Article image release gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  article-image-qa:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host --init
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify pinned Playwright browsers
        run: node scripts/operations/assert-playwright-container.mjs
      - run: npm run build
      - name: Start app and verify article image framing
        run: |
          npm run start -- -p 3000 > /tmp/brief-server.log 2>&1 &
          for i in $(seq 1 60); do if curl -fsS http://127.0.0.1:3000/articles/maude-nfc-east-declines-winner > /dev/null; then break; fi; sleep 2; done
          QA_BASE_URL=http://127.0.0.1:3000 npx playwright test qa/tests/article-image-framing.spec.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: article-image-qa-report
          path: |
            qa/reports/browser-html
            qa/test-results
